{% load core_extras %}
<div class="mt-2">
    <p id="{{ chart_id }}-summary" class="sr-only">
        {{ title }}: {{ count }} data point{{ count|pluralize }}. Full values available in the table below.
    </p>
    <button type="button"
            class="chart-table-toggle text-xs text-indigo-600 hover:underline font-semibold"
            aria-expanded="false"
            aria-controls="{{ chart_id }}-table"
            onclick="var t=document.getElementById('{{ chart_id }}-table'); var hidden=t.classList.toggle('hidden'); this.setAttribute('aria-expanded', hidden ? 'false' : 'true'); this.textContent = hidden ? 'View as table' : 'Hide table';">
        View as table
    </button>
    <div id="{{ chart_id }}-table" class="hidden mt-2 overflow-x-auto">
        <table class="w-full text-xs border border-gray-100 rounded-lg">
            <caption class="sr-only">{{ title }}</caption>
            <thead>
                <tr class="bg-gray-50 text-gray-500 text-left">
                    <th scope="col" class="px-3 py-2">Label</th>
                    <th scope="col" class="px-3 py-2">{{ value_label }}</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for label, value in pairs %}
                <tr>
                    <td class="px-3 py-2">{{ label }}</td>
                    <td class="px-3 py-2 font-medium">{{ value }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="2" class="px-3 py-2 text-gray-400">No data.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
